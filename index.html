<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#d97706" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PourOver Pro 手沖咖啡計時器</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/924/924514.png" />
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #333;
      --accent: #d97706;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --open: #10b981;
      --closed: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 60px; }
    h1 { font-size: 1.35rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 6px; }
    select, input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #262626; color: var(--text); font-size: 1rem; margin-bottom: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .valve-badge { text-align: center; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 1.3rem; margin-bottom: 12px; transition: 0.2s; }
    .valve-open { background: rgba(16, 185, 129, 0.2); border: 2px solid var(--open); color: #34d399; }
    .valve-closed { background: rgba(239, 68, 68, 0.2); border: 2px solid var(--closed); color: #f87171; }
    .timer-display { font-size: 3.6rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin: 8px 0; }
    .step-box { background: #262626; border-left: 4px solid var(--accent); padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .btn-row { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-sec { background: #374151; color: #fff; }
    .step-list { list-style: none; font-size: 0.9rem; }
    .step-list li { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .step-list li.active-step { color: var(--accent); font-weight: 700; }
    .sub-info { font-size: 0.82rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>
    <span>☕ PourOver Pro</span>
    <button id="wakeBtn" style="flex:0; padding:6px 12px; font-size:0.8rem;" class="btn-sec">⚡ 防熄芒: 關</button>
  </h1>

  <div class="card">
    <label>選擇沖煮配方（淺中焙專用）</label>
    <select id="recipeSelect">
      <option value="devil">Switch - 粕谷哲「惡魔沖法」(前滴後浸/極甜)</option>
      <option value="devil_acid">Switch - 惡魔沖法 (80+40 偏明亮果酸)</option>
      <option value="devil_sweet">Switch - 惡魔沖法 (40+80 偏濃郁甜感)</option>
      <option value="half">Switch - Coffee Chronicler 50/50 對半混合</option>
      <option value="bloom">Switch - 關閥悶蒸 + 多段滴濾 (高萃取)</option>
      <option value="waterfirst">Switch - 先水後粉全浸泡 (防細粉塞濾紙)</option>
      <option value="iced">Switch - 急冷冰手沖 (含冰塊比例)</option>
      <option value="kadou">Kadou 星芒濾杯 - 淺中焙三刀流</option>
      <option value="v60">Hario V60 - 4:6 法則標準版</option>
    </select>

    <div class="grid-2">
      <div>
        <label>咖啡粉重 (g)</label>
        <input type="number" id="coffeeGrams" value="15" min="8" max="60" />
      </div>
      <div>
        <label>粉水比 (1 : X)</label>
        <input type="number" id="ratioInput" value="16" step="0.5" min="10" max="20" />
      </div>
    </div>
    <div id="recipeSummary" class="sub-info"></div>
  </div>

  <div class="card">
    <div id="valveStatus" class="valve-badge valve-open">🟢 開閥 (OPEN)</div>
    <div id="timerDisplay" class="timer-display">00:00</div>
    <div id="currentInstruction" class="step-box">按「開始計時」啟動手沖引導</div>

    <div class="btn-row">
      <button id="startBtn" class="btn-primary">開始 / 暫停</button>
      <button id="resetBtn" class="btn-sec">重設</button>
    </div>
  </div>

  <div class="card">
    <label>分段注水時間軸</label>
    <ul id="stepList" class="step-list"></ul>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    const RECIPES = {
      devil: {
        ratio: 14, temp: "前段 92°C / 1:15降溫至 70°C",
        steps: (c, w) => [
          { t: 0, valve: "OPEN", target: Math.round(w * 0.214), text: "92°C 開閥悶蒸" },
          { t: 30, valve: "OPEN", target: Math.round(w * 0.428), text: "92°C 第二段滴濾注水" },
          { t: 75, valve: "CLOSED", target: w, text: "關閥！兌室溫水降至 70°C 注滿浸泡" },
          { t: 105, valve: "OPEN", target: w, text: "開閥放水，等待流乾 (約 3:00 完成)" }
        ]
      },
      devil_acid: {
        ratio: 14, temp: "前段 92°C / 1:15降溫至 70°C",
        steps: (c, w) => [
          { t: 0, valve: "OPEN", target: Math.round(w * 0.285), text: "92°C 開閥大水悶蒸 (突出果酸)" },
          { t: 30, valve: "OPEN", target: Math.round(w * 0.428), text: "92°C 第二段補水" },
          { t: 75, valve: "CLOSED", target: w, text: "關閥！70°C 溫水注滿浸泡" },
          { t: 105, valve: "OPEN", target: w, text: "開閥流乾" }
        ]
      },
      devil_sweet: {
        ratio: 14, temp: "前段 92°C / 1:15降溫至 70°C",
        steps: (c, w) => [
          { t: 0, valve: "OPEN", target: Math.round(w * 0.143), text: "92°C 開閥小水悶蒸 (突出甜感)" },
          { t: 30, valve: "OPEN", target: Math.round(w * 0.428), text: "92°C 第二段大水注水" },
          { t: 75, valve: "CLOSED", target: w, text: "關閥！70°C 溫水注滿浸泡" },
          { t: 105, valve: "OPEN", target: w, text: "開閥流乾" }
        ]
      },
      half: {
        ratio: 16, temp: "93°C",
        steps: (c, w) => [
          { t: 0, valve: "OPEN", target: Math.round(w * 0.5), text: "開閥直接注水一半，免獨立悶蒸" },
          { t: 45, valve: "CLOSED", target: w, text: "關閥！注入剩餘一半水量浸泡" },
          { t: 120, valve: "OPEN", target: w, text: "開閥放水，約 2:45 流乾" }
        ]
      },
      bloom: {
        ratio: 15.5, temp: "93°C",
        steps: (c, w) => [
          { t: 0, valve: "CLOSED", target: Math.round(c * 3), text: "關閥悶蒸，輕搖確保乾粉全濕" },
          { t: 40, valve: "OPEN", target: Math.round(w * 0.6), text: "開閥放水並注入第一段水" },
          { t: 85, valve: "OPEN", target: w, text: "保持開閥，注入尾段水至總水量" }
        ]
      },
      waterfirst: {
        ratio: 16, temp: "94°C",
        steps: (c, w) => [
          { t: 0, valve: "CLOSED", target: w, text: "關閥！先注入全部熱水（未落粉）" },
          { t: 15, valve: "CLOSED", target: w, text: "倒入咖啡粉，輕輕壓濕攪拌浸泡" },
          { t: 120, valve: "CLOSED", target: w, text: "表面輕攪一下讓粉沉底" },
          { t: 135, valve: "OPEN", target: w, text: "開閥快速放水（防細粉塞濾紙）" }
        ]
      },
      iced: {
        ratio: 15, temp: "93°C (下壺放冰)",
        steps: (c, w) => {
          const ice = Math.round(w * 0.35);
          const hot = w - ice;
          return [
            { t: 0, valve: "OPEN", target: Math.round(hot * 0.5), text: `下壺先放 ${ice}g 冰！開閥注一半熱水` },
            { t: 40, valve: "CLOSED", target: hot, text: `關閥！注入剩餘熱水至 ${hot}g 浸泡` },
            { t: 100, valve: "OPEN", target: hot, text: "開閥落冰急冷，搖勻即可飲用" }
          ];
        }
      },
      kadou: {
        ratio: 15.5, temp: "92°C–93°C (星芒濾杯)",
        steps: (c, w) => [
          { t: 0, valve: "OPEN", target: Math.round(c * 2.5), text: "悶蒸注水，由中心向外繞圈" },
          { t: 35, valve: "OPEN", target: Math.round(w * 0.65), text: "第一段柔水繞圈注水，拉高水位" },
          { t: 75, valve: "OPEN", target: w, text: "中心定點連綿注水至目標水量" }
        ]
      },
      v60: {
        ratio: 15, temp: "92°C (V60)",
        steps: (c, w) => [
          { t: 0, valve: "OPEN", target: Math.round(w * 0.2), text: "第一段悶蒸 (調整酸甜)" },
          { t: 45, valve: "OPEN", target: Math.round(w * 0.4), text: "第二段注水" },
          { t: 90, valve: "OPEN", target: Math.round(w * 0.7), text: "第三段注水 (調整濃度)" },
          { t: 130, valve: "OPEN", target: w, text: "最後一段注水，約 2:45 流完" }
        ]
      }
    };

    const recipeSelect = document.getElementById('recipeSelect');
    const coffeeGrams = document.getElementById('coffeeGrams');
    const ratioInput = document.getElementById('ratioInput');
    const recipeSummary = document.getElementById('recipeSummary');
    const stepList = document.getElementById('stepList');
    const valveStatus = document.getElementById('valveStatus');
    const timerDisplay = document.getElementById('timerDisplay');
    const currentInstruction = document.getElementById('currentInstruction');

    let timer = null;
    let seconds = 0;
    let currentSteps = [];

    function beep(freq = 880, dur = 120) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = freq;
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(() => osc.stop(), dur);
      } catch (e) {}
    }

    function renderRecipe(updateRatio = false) {
      const key = recipeSelect.value;
      const r = RECIPES[key];
      if (updateRatio) ratioInput.value = r.ratio;
      const c = parseFloat(coffeeGrams.value) || 15;
      const ratio = parseFloat(ratioInput.value) || 15;
      const totalWater = Math.round(c * ratio);
      currentSteps = r.steps(c, totalWater);

      recipeSummary.innerHTML = `總水量：<strong>${totalWater}g</strong> ｜ 建議水溫：<strong>${r.temp}</strong>`;
      stepList.innerHTML = currentSteps.map((s, idx) =>
        `<li id="step-${idx}"><span>${formatTime(s.t)} [${s.valve === 'OPEN' ? '🟢開閥' : '🔴關閥'}] ${s.text}</span><strong>${s.target}g</strong></li>`
      ).join('');
      updateActiveStep();
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateActiveStep() {
      let active = currentSteps[0];
      let activeIdx = 0;
      currentSteps.forEach((s, idx) => {
        if (seconds >= s.t) { active = s; activeIdx = idx; }
      });

      document.querySelectorAll('#stepList li').forEach((el, idx) => {
        el.classList.toggle('active-step', idx === activeIdx);
      });

      if (active.valve === 'OPEN') {
        valveStatus.className = 'valve-badge valve-open';
        valveStatus.textContent = '🟢 開閥 (OPEN)';
      } else {
        valveStatus.className = 'valve-badge valve-closed';
        valveStatus.textContent = '🔴 關閥 (CLOSED)';
      }
      currentInstruction.innerHTML = `<strong>目標水量：${active.target}g</strong><br>${active.text}`;
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
      } else {
        beep(660, 100);
        timer = setInterval(() => {
          seconds++;
          timerDisplay.textContent = formatTime(seconds);
          currentSteps.forEach(s => {
            if (seconds === s.t) beep(980, 220);
          });
          updateActiveStep();
        }, 1000);
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      clearInterval(timer);
      timer = null;
      seconds = 0;
      timerDisplay.textContent = "00:00";
      updateActiveStep();
    });

    recipeSelect.addEventListener('change', () => renderRecipe(true));
    coffeeGrams.addEventListener('input', () => renderRecipe(false));
    ratioInput.addEventListener('input', () => renderRecipe(false));

    let wakeLock = null;
    const wakeBtn = document.getElementById('wakeBtn');
    wakeBtn.addEventListener('click', async () => {
      if (!('wakeLock' in navigator)) return alert('此瀏覽器不支援 WakeLock');
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
        wakeBtn.textContent = '⚡ 防熄芒: 關';
      } else {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeBtn.textContent = '⚡ 防熄芒: 開';
      }
    });

    renderRecipe(true);
  </script>
</body>
</html>
